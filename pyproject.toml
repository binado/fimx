[project]
name = "fisharr"
version = "0.1.0"
description = "Dense Fisher matrix functions on labeled xarray arrays"
readme = "README.md"
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "xarray",
    "xarray-einstats>=0.10.0",
]

[project.optional-dependencies]
io = ["h5netcdf[h5py]"]
plotting = ["getdist", "matplotlib"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "getdist>=1.7.7",
    "h5netcdf[h5py]",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "prek>=0.5.3",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.83",
]

[tool.ruff]
extend-exclude = ["examples"]

[tool.ty.src]
include = ["src", "tests"]
