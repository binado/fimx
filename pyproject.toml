[project]
name = "fimx"
version = "0.1.0"
description = "Dense Fisher matrix functions on labeled xarray arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "binado", email = "bernardopveronese@gmail.com" }
]
keywords = ["fisher-matrix", "forecasting", "cosmology", "xarray"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "xarray",
    "xarray-einstats>=0.10.0",
]

[project.optional-dependencies]
io = ["h5netcdf[h5py]"]
plotting = ["getdist", "matplotlib"]

[project.urls]
Homepage = "https://github.com/binado/fimx"
Repository = "https://github.com/binado/fimx"
Issues = "https://github.com/binado/fimx/issues"

[project.scripts]
fimx-plot = "fimx.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "getdist>=1.7.7",
    "h5netcdf[h5py]",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "prek>=0.5.3",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.83",
]

[tool.ruff]
extend-exclude = ["examples"]

[tool.ty.src]
include = ["src", "tests"]
